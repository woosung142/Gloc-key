apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-ingress
  namespace: test
spec:
  rules:
  - host: www.glok.store
    http:
      paths:
      - path: /whoami
        pathType: Prefix
        backend:
          service:
            name: ip-check-svc
            port:
              number: 80