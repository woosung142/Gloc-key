apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack-engine
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 79.6.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/k3s/setup/monitoring/helm-engine/values.yaml

    - repoURL: https://github.com/woosung142/Gloc-key.git
      targetRevision: ccid
      ref: values
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true